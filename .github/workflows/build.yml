name: Build Windows
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        if: matrix.arch == 'x64'
      - run: npm run test:e2e
        if: matrix.arch == 'x64'
      - run: npm run build:icon
      - run: npx electron-builder --win --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/checksums.mjs
      - run: npm run test:package
        if: matrix.arch == 'x64'
      - uses: actions/upload-artifact@v4
        with:
          name: Brisa-Windows-${{ matrix.arch }}
          path: |
            dist/Brisa-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
